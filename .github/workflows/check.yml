name: Checks and Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project native/Nexora.Memory/Nexora.Memory.csproj -c Release -- --self-test
  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm run trainer:build
      - run: npm run package:win
      - name: Verify bundle
        shell: pwsh
        run: |
          if (!(Test-Path dist/Nexora-win32-x64/Nexora.exe)) { throw 'Executable missing' }
          if (!(Test-Path dist/Nexora-win32-x64/resources/app/node_modules/systeminformation/package.json)) { throw 'Runtime dependency missing' }
          node -e "require('./dist/Nexora-win32-x64/resources/app/node_modules/systeminformation'); console.log('Runtime dependency loads')"
          node scripts/ocr-smoke.cjs ./dist/Nexora-win32-x64/resources/app/translator.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Local OCR self-test failed' }
          node -e "import('./dist/Nexora-win32-x64/resources/app/node_modules/@huggingface/transformers/dist/transformers.node.mjs').then(()=>console.log('Local model runtime loads')).catch(e=>{console.error(e);process.exitCode=1})"
          if ($LASTEXITCODE -ne 0) { throw 'Local model runtime failed' }
          & ./dist/Nexora-win32-x64/resources/app/native-bin/Nexora.Memory.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native self-test failed' }
      - name: Build CI-only native fixture outside application bundle
        run: dotnet publish test/fixtures/Nexora.TrainingFixture/Nexora.TrainingFixture.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/test-fixture
      - name: Verify real cross-process trainer on owned training fixture
        run: node scripts/training-smoke.cjs ./dist/Nexora-win32-x64/resources/app ./dist/test-fixture/Nexora.TrainingFixture.exe
      - name: Ensure training fixture is excluded from distributable
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/Nexora-win32-x64 -Recurse -File | Where-Object { $_.Name -in @('training-demo.cjs','training-fixture.cjs','Nexora.TrainingFixture.exe') }
          if ($files) { throw 'Test-only fixture leaked into distributable' }
      - name: Verify graphical application startup and navigation
        shell: pwsh
        run: ./scripts/ui-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-UI-preview
          path: dist/ui-preview/*.png
          if-no-files-found: error
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -notin @(0,1641,3010)) { throw 'Inno Setup installation failed' }
      - run: npm run installer:win
      - name: Verify install and uninstall
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Setup-Windows-x64
          path: dist/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Windows-x64
          path: dist/Nexora-win32-x64/
          if-no-files-found: error

  local-model-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[local-model-test]'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node scripts/local-translate-smoke.cjs
      - run: node scripts/local-translate-smoke.cjs ./local-model.cjs advanced
      - run: node scripts/local-translate-smoke.cjs ./local-model.cjs quality
        if: always()

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-alpha]')
    needs: [windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nexora-Setup-Windows-x64
          path: release
      - name: Publish tested installer as GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          $exe = "release/Nexora-Setup-$v-x64.exe"
          $sha = "$exe.sha256"
          if (!(Test-Path $exe) -or !(Test-Path $sha)) { throw 'Missing installer' }
          $expected = ((Get-Content $sha -Raw).Trim() -split '\s+')[0]
          $hasher = [Security.Cryptography.SHA256]::Create(); $stream = [IO.File]::OpenRead((Resolve-Path $exe).Path)
          try { $actual = [BitConverter]::ToString($hasher.ComputeHash($stream)).Replace('-','') } finally { $stream.Dispose(); $hasher.Dispose() }
          if ($actual -ne $expected) { throw 'Installer digest mismatch' }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Nexora $v Alpha" --notes "Windows x64. First public test build. Unsigned installer. Built-in game commands, local translator, mod manager and verified update download. Tested in CI; real game compatibility is not yet verified." --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create release' }
          gh release upload $tag $exe $sha --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release' }
          gh release edit $tag --draft=false --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release' }
