name: Checks and Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project native/Nexora.Memory/Nexora.Memory.csproj -c Release -- --self-test
  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm run trainer:build
      - run: npm run package:win
      - name: Verify bundle
        shell: pwsh
        run: |
          if (!(Test-Path dist/Nexora-win32-x64/Nexora.exe)) { throw 'Executable missing' }
          if (!(Test-Path dist/Nexora-win32-x64/resources/app/node_modules/systeminformation/package.json)) { throw 'Runtime dependency missing' }
          node -e "require('./dist/Nexora-win32-x64/resources/app/node_modules/systeminformation'); console.log('Runtime dependency loads')"
          node scripts/ocr-smoke.cjs ./dist/Nexora-win32-x64/resources/app/translator.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Local OCR self-test failed' }
          node -e "import('./dist/Nexora-win32-x64/resources/app/node_modules/@huggingface/transformers/dist/transformers.node.mjs').then(()=>console.log('Local model runtime loads')).catch(e=>{console.error(e);process.exitCode=1})"
          if ($LASTEXITCODE -ne 0) { throw 'Local model runtime failed' }
          & ./dist/Nexora-win32-x64/resources/app/native-bin/Nexora.Memory.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native self-test failed' }
      - name: Verify real cross-process trainer on owned training fixture
        run: node scripts/training-smoke.cjs ./dist/Nexora-win32-x64/resources/app
      - name: Verify graphical application startup and navigation
        shell: pwsh
        run: ./scripts/ui-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-UI-preview
          path: dist/ui-preview/*.png
          if-no-files-found: error
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -notin @(0,1641,3010)) { throw 'Inno Setup installation failed' }
      - run: npm run installer:win
      - name: Verify install and uninstall
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Setup-Windows-x64
          path: dist/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Windows-x64
          path: dist/Nexora-win32-x64/
          if-no-files-found: error

  local-model-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[local-model-test]'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node scripts/local-translate-smoke.cjs
      - run: node scripts/local-translate-smoke.cjs ./local-model.cjs advanced
      - run: node scripts/local-translate-smoke.cjs ./local-model.cjs quality
        if: always()
