name: Checks and Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project native/Nexora.Memory/Nexora.Memory.csproj -c Release -- --self-test
  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm run trainer:build
      - run: npm run package:win
      - name: Verify bundle
        shell: pwsh
        run: |
          if (!(Test-Path dist/Nexora-win32-x64/Nexora.exe)) { throw 'Executable missing' }
          if (!(Test-Path dist/Nexora-win32-x64/resources/app/node_modules/systeminformation/package.json)) { throw 'Runtime dependency missing' }
          node -e "require('./dist/Nexora-win32-x64/resources/app/node_modules/systeminformation'); console.log('Runtime dependency loads')"
          node scripts/ocr-smoke.cjs ./dist/Nexora-win32-x64/resources/app/translator.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Local OCR self-test failed' }
          & ./dist/Nexora-win32-x64/resources/app/native-bin/Nexora.Memory.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Windows-x64
          path: dist/Nexora-win32-x64/
          if-no-files-found: error
